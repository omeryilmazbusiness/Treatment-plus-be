services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: treatment
      POSTGRES_PASSWORD: treatment
      POSTGRES_DB: treatment_plus
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - treatment_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treatment -d treatment_plus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  treatment_pg:
