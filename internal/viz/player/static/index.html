<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Treatment Plus — 3D hamleler</title>
  <style>
    :root { --ink:#e8eef7; --muted:#93a4bb; --line:#1f3a5f; --bg:#07111f; --panel:#0c1a2e; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #ui { position:fixed; inset:0 auto 0 0; width:min(340px, 92vw); padding:18px; background:linear-gradient(180deg, #0c1a2ecc, #07111fdd); border-right:1px solid var(--line); z-index:2; overflow:auto; backdrop-filter: blur(10px); }
    h1 { font-size:15px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 12px; color:#7dd3fc; }
    select, button { width:100%; margin:6px 0; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#10233d; color:var(--ink); }
    button.primary { background:var(--accent); border-color:#2563eb; font-weight:650; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    #caption { margin-top:14px; padding:12px; border-radius:12px; background:#10233d; min-height:88px; }
    #caption b { display:block; color:#fde68a; margin-bottom:6px; }
    #caption span { color:var(--muted); }
    #graph { margin-top:12px; font:11px/1.35 ui-monospace, monospace; color:#93a4bb; white-space:pre; max-height:36vh; overflow:auto; }
    #stage { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.7/+esm"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h1>3D tedavi hamleleri</h1>
    <label>Tedavi</label>
    <select id="clip"></select>
    <div class="row">
      <button id="prev" type="button">Önceki hamle</button>
      <button id="next" type="button">Sonraki hamle</button>
    </div>
    <button id="play" class="primary" type="button">Planı oynat</button>
    <div id="caption"><b>Hazır</b><span>Mevcut GLTF ağız modeli. Mesh isimleri konsola ve aşağıya dökülür.</span></div>
    <pre id="graph"></pre>
  </div>
  <div id="stage"></div>
  <script type="module" src="player.js?v=20"></script>
</body>
</html>
