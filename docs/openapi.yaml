openapi: 3.0.3
info:
  title: Treatment Plus API
  version: 0.3.0
  description: Users authenticate. Role clinic|personal authorizes. Clinic brand is stored once. Each Classic PDF selects palette and locale. Cookies stay on the Next BFF.
servers:
  - url: /v1
paths:
  /auth/register:
    post:
      summary: Register a user as clinic or personal
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      summary: Rotate refresh token
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke the refresh token family
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: No content
  /auth/me:
    get:
      summary: Current user and workspace
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /workspaces/{workspaceID}:
    get:
      summary: Own workspace only
      operationId: getWorkspace
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "403":
          $ref: "#/components/responses/Error"
  /clinics/{clinicID}:
    get:
      summary: Own workspace (alias)
      operationId: getClinic
      security:
        - bearerAuth: []
      parameters:
        - name: clinicID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "403":
          $ref: "#/components/responses/Error"
  /catalog/diagnoses:
    get:
      summary: List diagnoses for workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create diagnosis
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /catalog/treatments:
    get:
      summary: List treatments for workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create treatment
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /catalog/price-lists:
    get:
      summary: List price lists for workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create price list
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /patients:
    get:
      summary: List patients
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create patient
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /clinic/settings:
    get:
      summary: Wise clinic brand stored on the account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicSettings"
    patch:
      summary: Update clinic brand (cover, doctor, lab, hotel, contact)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicSettings"
  /plans/classic/form:
    get:
      summary: Classic form. Clinic brand is read-only. First step selects palette and locale.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/classic:
    post:
      summary: Submit one Classic plan. Palette and locale are required per PDF.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassicPlanRequest"
      responses:
        "201":
          description: Created
        "422":
          $ref: "#/components/responses/Error"
  /plans:
    get:
      summary: List plans for current workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create classic plan
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /plans/{id}:
    get:
      summary: Get plan details with visits, items, discounts and totals
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    patch:
      summary: Update plan title or diagnoses
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/visits:
    put:
      summary: Replace visits for plan
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/items:
    put:
      summary: Replace items for plan (recalculates subtotal)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/discounts:
    put:
      summary: Replace discounts for plan (recalculates grand total)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/ready:
    post:
      summary: Lock plan and freeze snapshot
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/pdf:
    post:
      summary: Generate the 24-page Classic PDF from the locked snapshot
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
        "422":
          $ref: "#/components/responses/Error"
    get:
      summary: Download the generated Classic PDF
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /media:
    post:
      summary: Upload a clinic image (jpeg/png). Use the returned key on clinic settings or the plan.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [logo, cover, about, team, doctor, xray, lab, hotel, before, after, other]
      responses:
        "201":
          description: Created
        "422":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [clinic, personal]
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        clinic:
          $ref: "#/components/schemas/ClinicProfile"
    ClinicProfile:
      type: object
      description: One-time Wise brand. Required when role is clinic. Palette here is the account default; each PDF still selects its own.
      required: [phone, email, address, hours, slogan, signer_name]
      properties:
        slogan:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        address:
          type: string
        hours:
          type: string
        locale:
          type: string
          enum: [tr, en]
        currency:
          type: string
          enum: [TRY, EUR, USD]
        palette:
          type: string
          enum: [navy, forest, rose, slate]
        logo_key:
          type: string
        cover_key:
          type: string
        map_url:
          type: string
        intro:
          type: string
        legal:
          type: string
        about_text:
          type: string
        about_key:
          type: string
        welcome_body:
          type: string
        signer_name:
          type: string
        signer_title:
          type: string
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/ClinicStat"
        doctor:
          $ref: "#/components/schemas/ClinicDoctor"
        lab:
          $ref: "#/components/schemas/ClinicLab"
        awards:
          $ref: "#/components/schemas/ClinicAwards"
        hotel:
          $ref: "#/components/schemas/ClinicHotel"
    ClinicStat:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
    ClinicDoctor:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        subtitle: { type: string }
        bio: { type: string }
        photo_key: { type: string }
        stats:
          type: array
          items:
            $ref: "#/components/schemas/ClinicStat"
    ClinicLab:
      type: object
      properties:
        title: { type: string }
        text: { type: string }
        image_key: { type: string }
        stats:
          type: array
          items:
            $ref: "#/components/schemas/ClinicStat"
    ClinicAwards:
      type: object
      properties:
        text: { type: string }
        badge_keys:
          type: array
          items: { type: string }
    ClinicHotel:
      type: object
      properties:
        name: { type: string }
        text: { type: string }
        image_key: { type: string }
    ClinicSettings:
      allOf:
        - $ref: "#/components/schemas/ClinicProfile"
        - type: object
          properties:
            workspace_id:
              type: string
            name:
              type: string
    ClassicPlanRequest:
      type: object
      required: [palette, locale, patient]
      properties:
        palette:
          type: string
          enum: [navy, forest, rose, slate]
        locale:
          type: string
          enum: [tr, en]
        patient:
          type: object
          required: [name]
          properties:
            name: { type: string }
            contact: { type: string }
        title:
          type: string
        situation:
          type: object
          properties:
            xray_key: { type: string }
            chart_teeth:
              type: array
              items: { type: string }
            tooth_findings:
              type: array
              items:
                type: object
                properties:
                  tooth: { type: string }
                  status: { type: string, enum: [intact, missing, filled, crown] }
                  note: { type: string }
            general_diagnoses:
              type: array
              items: { type: string }
        visits:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              phase_label: { type: string }
              healing_note: { type: string }
              chart_teeth:
                type: array
                items: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              treatment_name: { type: string }
              description: { type: string }
              teeth:
                type: array
                items: { type: string }
              quantity: { type: integer }
              unit_price: { type: integer }
              is_package: { type: boolean }
        discounts:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { type: integer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Workspace:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/Role"
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
    AuthResponse:
      type: object
      required: [user, workspace, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
        tokens:
          $ref: "#/components/schemas/Tokens"
    MeResponse:
      type: object
      required: [user, workspace]
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
