openapi: 3.0.3
info:
  title: Treatment Plus API
  version: 0.2.0
  description: Users authenticate. Role clinic|personal authorizes. Cookies stay on the Next BFF.
servers:
  - url: /v1
paths:
  /auth/register:
    post:
      summary: Register a user as clinic or personal
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      summary: Rotate refresh token
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke the refresh token family
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: No content
  /auth/me:
    get:
      summary: Current user and workspace
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /workspaces/{workspaceID}:
    get:
      summary: Own workspace only
      operationId: getWorkspace
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "403":
          $ref: "#/components/responses/Error"
  /clinics/{clinicID}:
    get:
      summary: Own workspace (alias)
      operationId: getClinic
      security:
        - bearerAuth: []
      parameters:
        - name: clinicID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "403":
          $ref: "#/components/responses/Error"
  /catalog/diagnoses:
    get:
      summary: List diagnoses for workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create diagnosis
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /catalog/treatments:
    get:
      summary: List treatments for workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create treatment
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /catalog/price-lists:
    get:
      summary: List price lists for workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create price list
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /patients:
    get:
      summary: List patients
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create patient
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /plans:
    get:
      summary: List plans for current workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Create classic plan
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /plans/{id}:
    get:
      summary: Get plan details with visits, items, discounts and totals
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    patch:
      summary: Update plan title or diagnoses
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/visits:
    put:
      summary: Replace visits for plan
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/items:
    put:
      summary: Replace items for plan (recalculates subtotal)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/discounts:
    put:
      summary: Replace discounts for plan (recalculates grand total)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /plans/{id}/ready:
    post:
      summary: Lock plan and freeze snapshot
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [clinic, personal]
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Workspace:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/Role"
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
    AuthResponse:
      type: object
      required: [user, workspace, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
        tokens:
          $ref: "#/components/schemas/Tokens"
    MeResponse:
      type: object
      required: [user, workspace]
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspace:
          $ref: "#/components/schemas/Workspace"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
